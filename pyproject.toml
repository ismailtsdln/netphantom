[tool.poetry]
name = "netphantom"
version = "0.1.0"
description = "Network Phantom Poisoning & Authentication Capture Tool"
authors = ["ismailtasdelen <ismailtasdelen@gmail.com>"]
readme = "README.md"
packages = [{include = "netph"}]

[tool.poetry.dependencies]
python = "^3.11"
scapy = "^2.5.0"
rich = "^13.7.0"
netifaces = "^0.11.0"
asyncio = "^3.4.3"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
black = "^23.11.0"
flake8 = "^6.1.0"
mypy = "^1.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
